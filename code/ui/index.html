<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tramwaje Warszawskie — Live</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp }             from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ── CONFIG — fill these in from Firebase Console ──────────────────────────
    const FIREBASE_CONFIG = {
      apiKey:            "FIREBASE_API_KEY",
      authDomain:        "warsaw-tram-platform.firebaseapp.com",
      projectId:         "warsaw-tram-platform",
      storageBucket:     "warsaw-tram-platform.appspot.com",
      messagingSenderId: "858028405258",
      appId:             "FIREBASE_APP_ID",
    };

    // Prediction API — your Cloud Run service URL + key
    const PREDICTION_API_URL = "https://prediction-api-i3g3725yaa-lm.a.run.app";
    const PREDICTION_API_KEY = "PREDICTION_API_KEY_HERE";
    // ─────────────────────────────────────────────────────────────────────────

    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── Map ───────────────────────────────────────────────────────────────────
    const map = L.map("map").setView([52.2297, 21.0122], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors", maxZoom: 19,
    }).addTo(map);

    // ── State ─────────────────────────────────────────────────────────────────
    const markers  = {};
    const STALE_MS = 120_000;

    // ── Helpers ───────────────────────────────────────────────────────────────
    function delayColor(s) {
      if (s == null) return "#888";
      if (s <= 60)   return "#2ecc71";
      if (s <= 180)  return "#f39c12";
      return "#e74c3c";
    }

    function delayLabel(s) {
      if (s == null) return "brak danych";
      if (s <= 0)    return "punktualnie";
      const m = Math.floor(Math.abs(s) / 60), sec = Math.abs(s) % 60;
      const sign = s < 0 ? "−" : "+";
      return m > 0 ? `${sign}${m} min ${sec} s` : `${sign}${sec} s`;
    }

    function tramIcon(line, delay_s) {
      const c = delayColor(delay_s);
      return L.divIcon({
        html: `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="16" fill="${c}" stroke="white" stroke-width="2"/>
          <text x="18" y="23" text-anchor="middle" font-family="Arial,sans-serif"
                font-size="12" font-weight="bold" fill="white">${line ?? "?"}</text></svg>`,
        className: "", iconSize: [36,36], iconAnchor: [18,18], popupAnchor: [0,-20],
      });
    }

    function popupHtml(v) {
      const t = v.updated ? new Date(v.updated*1000).toLocaleTimeString("pl-PL") : "—";
      return `<div style="font:13px Arial,sans-serif;line-height:1.7">
        <b style="font-size:15px">Linia ${v.line ?? "?"}</b><br>
        Brygada: ${v.brigade ?? "—"}<br>
        Opóźnienie: <b>${delayLabel(v.delay_s)}</b><br>
        Nast. przystanek: ${v.next_stop_id ?? "—"}<br>
        <span style="color:#888;font-size:11px">Aktualizacja: ${t}</span><br>
        <button onclick="fillPredictionForm('${v.line}','${v.next_stop_id}','${v.brigade}')"
          style="margin-top:6px;padding:3px 10px;border:none;border-radius:4px;
                 background:#e94560;color:#fff;cursor:pointer;font-size:12px">
          Przewiduj opóźnienie →
        </button></div>`;
    }

    function updateStats(vehicles) {
      const total   = vehicles.length;
      const delayed = vehicles.filter(v => (v.delay_s ?? 0) > 60).length;
      const onTime  = vehicles.filter(v => (v.delay_s ?? 0) <= 60).length;
      const avg     = total > 0
        ? Math.round(vehicles.reduce((s,v) => s+(v.delay_s??0),0)/total) : 0;
      document.getElementById("stat-total").textContent   = total;
      document.getElementById("stat-delayed").textContent = delayed;
      document.getElementById("stat-ontime").textContent  = onTime;
      document.getElementById("stat-avg").textContent     = delayLabel(avg);
      document.getElementById("last-update").textContent  = new Date().toLocaleTimeString("pl-PL");
    }

    // ── Fill prediction form from map popup ───────────────────────────────────
    window.fillPredictionForm = (line, stopId, brigade) => {
      document.getElementById("pred-line").value    = line    || "";
      document.getElementById("pred-stop").value    = stopId  || "";
      document.getElementById("pred-brigade").value = brigade || "";
      document.getElementById("pred-time").value    = new Date().toISOString().slice(0,16);
      document.getElementById("sidebar").classList.add("open");
      document.getElementById("pred-result").innerHTML = "";
    };

    // ── Firestore listener ────────────────────────────────────────────────────
    async function startListening() {
      await signInAnonymously(auth);

      onSnapshot(collection(db, "vehicles"), (snap) => {
        const now    = Date.now();
        const active = new Set();

        snap.forEach(doc => {
          const v  = doc.data();
          const id = doc.id;
          if (v.updated && (now - v.updated*1000) > STALE_MS) return;
          if (!v.lat || !v.lon) return;
          active.add(id);

          if (markers[id]) {
            markers[id].setLatLng([v.lat, v.lon]);
            markers[id].setIcon(tramIcon(v.line, v.delay_s));
            markers[id].getPopup()?.setContent(popupHtml(v));
          } else {
            markers[id] = L.marker([v.lat, v.lon], { icon: tramIcon(v.line, v.delay_s) })
              .addTo(map).bindPopup(popupHtml(v));
          }
        });

        for (const id of Object.keys(markers)) {
          if (!active.has(id)) { map.removeLayer(markers[id]); delete markers[id]; }
        }

        updateStats(
          snap.docs.map(d => d.data())
            .filter(v => v.updated && (Date.now()-v.updated*1000) <= STALE_MS)
        );
      });
    }

    // ── Prediction form ───────────────────────────────────────────────────────
    window.submitPrediction = async () => {
      const line    = document.getElementById("pred-line").value.trim();
      const stopId  = document.getElementById("pred-stop").value.trim();
      const brigade = document.getElementById("pred-brigade").value.trim();
      const ts      = document.getElementById("pred-time").value;

      if (!line || !stopId || !brigade || !ts) {
        document.getElementById("pred-result").innerHTML =
          `<div class="result-box error">Wypełnij wszystkie pola.</div>`;
        return;
      }

      document.getElementById("pred-result").innerHTML =
        `<div class="result-box loading">Obliczam…</div>`;

      try {
        const resp = await fetch(`${PREDICTION_API_URL}/v1/delay`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key":    PREDICTION_API_KEY,
          },
          body: JSON.stringify({
            line, stop_id: stopId, brigade,
            timestamp: new Date(ts).toISOString(),
          }),
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const delayS  = data.delay_seconds;
        const color   = delayColor(delayS);
        const label   = delayLabel(delayS);
        const conf    = Math.round((data.confidence ?? 0) * 100);
        const version = data.model_version ?? "—";

        document.getElementById("pred-result").innerHTML = `
          <div class="result-box" style="border-color:${color}">
            <div class="result-delay" style="color:${color}">${label}</div>
            <div class="result-meta">
              Pewność: <b>${conf}%</b> &nbsp;·&nbsp; Model: <b>${version}</b>
            </div>
            <div class="result-features">
              Cechy: ${(data.features_used ?? []).join(", ")}
            </div>
          </div>`;
      } catch (err) {
        document.getElementById("pred-result").innerHTML =
          `<div class="result-box error">Błąd: ${err.message}</div>`;
      }
    };

    startListening().catch(console.error);
  </script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #16213e;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #0f3460;
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size:17px; color:#e94560; letter-spacing:1px; }
    header span { font-size:12px; color:#aaa; }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 10px;
      background: #16213e;
      padding: 6px 16px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }
    .stat-box {
      background: #0f3460;
      border-radius: 6px;
      padding: 4px 12px;
      text-align: center;
      min-width: 80px;
    }
    .stat-box .val { font-size:18px; font-weight:bold; color:#e94560; }
    .stat-box .lbl { font-size:10px; color:#aaa; text-transform:uppercase; letter-spacing:.5px; }

    /* ── Main area ── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Sidebar ── */
    #sidebar {
      width: 0;
      overflow: hidden;
      background: #16213e;
      border-left: 2px solid #0f3460;
      transition: width .3s ease;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    #sidebar.open { width: 320px; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    .sidebar-header h2 { font-size:14px; color:#e94560; white-space:nowrap; }
    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: #fff; }

    .sidebar-body { padding: 14px; overflow-y: auto; flex: 1; }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 7px 10px;
      background: #0f3460;
      border: 1px solid #1a4a8a;
      border-radius: 5px;
      color: #eee;
      font-size: 13px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #e94560;
    }

    .pred-btn {
      width: 100%;
      padding: 10px;
      background: #e94560;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .pred-btn:hover { background: #c73652; }

    /* ── Result box ── */
    .result-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #0f3460;
      background: #0d1b33;
    }
    .result-box.error  { border-color: #e74c3c; color: #e74c3c; font-size:13px; }
    .result-box.loading { color:#aaa; font-size:13px; text-align:center; }
    .result-delay  { font-size: 26px; font-weight: bold; margin-bottom: 6px; }
    .result-meta   { font-size: 12px; color: #bbb; margin-bottom: 4px; }
    .result-features { font-size: 10px; color: #888; line-height: 1.5; }

    /* ── Toggle sidebar button ── */
    #toggle-sidebar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: #e94560;
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    #toggle-sidebar:hover { background: #c73652; }
    #sidebar.open ~ #toggle-sidebar { display: none; }

    /* ── Legend ── */
    .legend {
      position: absolute;
      bottom: 28px;
      left: 10px;
      z-index: 1000;
      background: rgba(22,33,62,.92);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #eee;
      border: 1px solid #0f3460;
    }
    .legend-item { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
    .legend-dot  { width:13px; height:13px; border-radius:50%; flex-shrink:0; }
  </style>
</head>
<body>

<header>
  <h1>🚋 Tramwaje Warszawskie — Live</h1>
  <span>Ostatnia aktualizacja: <b id="last-update">—</b></span>
</header>

<div class="stats">
  <div class="stat-box">
    <div class="val" id="stat-total">—</div>
    <div class="lbl">Tramwajów</div>
  </div>
  <div class="stat-box">
    <div class="val" id="stat-ontime" style="color:#2ecc71">—</div>
    <div class="lbl">Na czas</div>
  </div>
  <div class="stat-box">
    <div class="val" id="stat-delayed" style="color:#e74c3c">—</div>
    <div class="lbl">Opóźnionych</div>
  </div>
  <div class="stat-box">
    <div class="val" id="stat-avg" style="color:#f39c12">—</div>
    <div class="lbl">Śr. opóźnienie</div>
  </div>
</div>

<div class="main">
  <div id="map">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div> Na czas (≤1 min)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div> Małe opóźnienie (1–3 min)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div> Duże opóźnienie (>3 min)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#888"></div> Brak danych</div>
    </div>
  </div>

  <!-- Prediction sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>🔮 Przewiduj opóźnienie</h2>
      <button class="close-btn" onclick="document.getElementById('sidebar').classList.remove('open')">✕</button>
    </div>
    <div class="sidebar-body">
      <div class="form-group">
        <label>Linia</label>
        <input id="pred-line" type="text" placeholder="np. 3">
      </div>
      <div class="form-group">
        <label>ID Przystanku</label>
        <input id="pred-stop" type="text" placeholder="np. 1001">
      </div>
      <div class="form-group">
        <label>Brygada</label>
        <input id="pred-brigade" type="text" placeholder="np. 1">
      </div>
      <div class="form-group">
        <label>Data i godzina</label>
        <input id="pred-time" type="datetime-local">
      </div>
      <button class="pred-btn" onclick="submitPrediction()">Oblicz opóźnienie</button>
      <div id="pred-result"></div>
    </div>
  </div>
</div>

<!-- Button visible when sidebar is closed -->
<button id="toggle-sidebar"
  onclick="document.getElementById('sidebar').classList.add('open')">
  🔮 Przewiduj opóźnienie
</button>

<script>
  // Set default datetime to now
  const now = new Date();
  now.setSeconds(0,0);
  document.getElementById("pred-time").value = now.toISOString().slice(0,16);
</script>

</body>
</html>
